{h:"A. Pendahuluan",b:[
"Pada materi sebelumnya, kita telah belajar merancang motif Dayak sederhana. Kita mempelajari cara memilih inspirasi dari alam, menyederhanakan bentuk, menggunakan garis, membuat pola berulang, mengatur simetri, serta memilih warna. Pada materi ini, kita akan melangkah lebih jauh: membuat rancangan motif yang terinspirasi dari cerita rakyat Kalimantan Tengah.",
"Cerita rakyat bukan hanya hiburan. Di dalamnya dapat ditemukan tokoh, tempat, peristiwa, nilai kehidupan, serta hubungan manusia dengan alam. Unsur-unsur tersebut dapat menjadi sumber ide untuk membuat karya seni. Saat membuat motif, kita tidak perlu menggambar seluruh cerita. Kita dapat memilih satu bagian penting, lalu mengubahnya menjadi bentuk hias yang sederhana."]},
{h:"B. Tujuan Pembelajaran",b:[{ul:[

"Mengenali tokoh, latar, benda, dan nilai yang terdapat dalam cerita rakyat Kalimantan Tengah.",
"Memilih unsur cerita sebagai inspirasi motif.",
"Membuat rancangan motif dengan garis, bentuk, pola berulang, simetri, dan warna.",
"Menjelaskan makna rancangan motif dengan bahasa sendiri serta menghargai budaya daerah."]}]},
{h:"C. Apa Hubungan Cerita Rakyat dengan Motif?",b:[

["Nilai cerita","Kejujuran dan ketekunan","Pola yang teratur dan konsisten sebagai simbol pribadi tentang ketekunan."]]},
{s:"2. Contoh pengembangan ide motif"},
"Misalnya, seorang siswa ingin membuat motif bertema ketekunan Supak. Siswa tersebut memilih garis berkelok sebagai lambang perjalanan, daun sebagai unsur alam, dan bentuk utama sederhana di bagian tengah. Garis berkelok diulang di sisi kiri dan kanan, kemudian diberi warna yang serasi. Siswa dapat menjelaskan: “Saya memilih garis perjalanan dan daun untuk menggambarkan usaha yang terus dilakukan serta lingkungan tempat cerita berlangsung.” Ini adalah penafsiran pribadi siswa, bukan makna adat yang wajib diikuti."]},
{h:"E. Langkah-Langkah Membuat Motif dari Cerita Rakyat",b:[
{s:"Langkah 1 — Pahami cerita"},"Baca cerita atau ringkasannya. Cari tahu siapa tokohnya, apa masalahnya, di mana peristiwa berlangsung, dan nilai apa yang dapat dipelajari.",
{s:"Langkah 2 — Pilih satu ide utama"},"Pilih satu unsur yang paling menarik, misalnya tokoh, perjalanan, tumbuhan, tempat, atau nilai cerita. Jangan memasukkan semua unsur sekaligus.",
{s:"Langkah 3 — Buat daftar bentuk"},"Tuliskan 2–4 bentuk yang mungkin digunakan. Contoh: daun, garis berkelok, bentuk geometris, dan simbol sederhana.",

{s:"Langkah 5 — Susun komposisi"},"Tentukan bentuk utama dan bentuk pendukung. Atur jarak agar gambar tidak terlalu padat atau terlalu kosong.",
{s:"Langkah 6 — Buat pola berulang atau simetri"},"Ulangi bentuk secara horizontal, vertikal, diagonal, atau melingkar. Jika cocok, buat sisi kiri dan kanan yang seimbang.",

{s:"Langkah 8 — Beri judul dan penjelasan makna"},"Tuliskan judul motif, cerita yang menginspirasi, serta alasan memilih bentuk dan warna. Jelaskan sebagai gagasan karya sendiri."]},
